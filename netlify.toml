[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# 1. Semaphore SMS API proxy to Netlify serverless function
[[redirects]]
  from = "/api/sms/send"
  to = "/.netlify/functions/sms-send"
  status = 200

# 2. PayMongo Checkout Session API proxy
[[redirects]]
  from = "/api/paymongo/create-checkout-session"
  to = "/.netlify/functions/paymongo-checkout"
  status = 200

# 3. PayMongo Payment Verification API proxy
[[redirects]]
  from = "/api/paymongo/verify-payment"
  to = "/.netlify/functions/paymongo-verify"
  status = 200

# 4. PayMongo Real QR Ph Generation API proxy
[[redirects]]
  from = "/api/paymongo/generate-qrph"
  to = "/.netlify/functions/paymongo-qrph"
  status = 200

# 5. PayMongo Payment Intent Polling API proxy
[[redirects]]
  from = "/api/paymongo/check-payment-intent"
  to = "/.netlify/functions/paymongo-check"
  status = 200

# 6. Single Page Application (SPA) Client Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
